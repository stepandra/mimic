name = "mimic"
version = "0.1.0"
description = "A local-first compatibility laboratory for AI CLI wire protocols"
licences = ["MIT"]
target = "erlang"
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
mist = ">= 6.0.3 and < 7.0.0"
tom = ">= 2.1.0 and < 3.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
argv = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
