name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - name: Install corpus tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes b3sum zstd openssl
      - run: gleam deps download
      - name: Synthetic integration gate
        run: sh scripts/verify-integration.sh
